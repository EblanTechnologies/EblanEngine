name: "tests"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'windows-ci'

      - name: Build
        run: xmake build -v -y

      - name: Run Tests
        run: xmake run EblanEngineTests

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 \
            libc++-17-dev \
            libc++abi-17-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxext-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            build-essential \
            pkg-config

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ubuntu-ci'

      - name: Build
        run: xmake build -v -y

      - name: Run Tests
        run: xmake run EblanEngineTests

